[package]
name = "mengshee-ai-chat"
version = "0.1.0"
description = "Chat about the document open in Mengshee"
authors = ["Mengshee"]
license = "GPL-2.0-or-later"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation"] }
