name: Deploy website and user guide

on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: website/guide/package-lock.json
      - name: Build bilingual guide
        working-directory: website/guide
        run: |
          npm ci
          npm run build
          node scripts/stage.mjs
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/.site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
